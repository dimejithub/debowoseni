# Render blueprint for the debowoseni.com backend.
#
# This file is the deployment config for the self-hosted FastAPI service, so
# Render can create it straight from the repo:
#
#   Render dashboard -> New -> Blueprint -> pick this repository.
#
# Only the frontend lives on Cloudflare Pages. This service handles admin
# writes, form submissions, email sending and the automation runner. Public
# reads go straight to Supabase and do not depend on it being awake.
services:
  - type: web
    name: debowoseni-api
    runtime: python
    plan: starter # $7/mo, always-on — no spin-down, so the admin panel never cold-starts.
    region: frankfurt # Closest to the UK audience and the eu-west-1 mail setup.
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # --- Required. The service refuses to boot without these three, since
      # server.py reads them at import time. Copy from Supabase -> Settings ->
      # API. The service key is secret and must never reach the frontend.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

      # --- Admin seeding. On first boot the service creates this user if it
      # does not exist. Set ADMIN_PASSWORD to the rotated password.
      - key: ADMIN_EMAIL
        value: admin@debowoseni.com
      - key: ADMIN_PASSWORD
        sync: false

      # --- Email. Without RESEND_API_KEY the mailer runs in dry-run mode:
      # sends are logged rather than delivered, and the dashboard says so.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Debo Owoseni <hello@debowoseni.com>
      - key: MAIL_REPLY_TO
        value: hello@debowoseni.com
      - key: PUBLIC_SITE_URL
        value: https://debowoseni.com

      # --- Automations. Must match the AUTOMATION_TOKEN repository secret, or
      # the hourly GitHub Action cannot authenticate and sequences never send.
      - key: AUTOMATION_TOKEN
        sync: false

      # --- Optional. Where "new registration" alerts are emailed. Defaults to
      # MAIL_REPLY_TO (hello@), which forwards to Debo. Set to another address
      # to send the alerts somewhere else.
      - key: EVENT_NOTIFY_EMAIL
        sync: false

      # --- Optional. Opens and clicks stay at zero without the webhook secret;
      # /community records joins but emails the invite link without the URL.
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: COMMUNITY_LTE_INVITE_URL
        sync: false

      # --- Browsers enforce this. Add the Pages preview domain too if you want
      # the admin panel to work from a branch preview.
      - key: CORS_ORIGINS
        value: https://debowoseni.com,https://www.debowoseni.com

  # ---------------------------------------------------------------------------
  # Scheduled automations. Render-native cron that fires the same tick the
  # GitHub Action does — drip sequences, event countdown reminders (7/3/2/1
  # days), and the journal digest. Render's scheduler is dependable, so this
  # replaces GitHub Actions' throttled cron (which only ran every few hours).
  # The endpoint is idempotent (each send is de-duped), so running alongside
  # the GitHub Action — or overlapping ticks — never double-sends.
  #
  # The backend host and the automation token are wired automatically from the
  # web service above, so there is nothing to paste for this job.
  # ---------------------------------------------------------------------------
  - type: cron
    name: debowoseni-automations
    runtime: python
    region: frankfurt
    rootDir: backend
    schedule: "*/15 * * * *" # every 15 minutes
    buildCommand: pip install --quiet httpx
    startCommand: >-
      python -c "import os,httpx;r=httpx.post('https://'+os.environ['BACKEND_HOST']+'/api/tasks/run-sequences',headers={'X-Task-Token':os.environ['AUTOMATION_TOKEN']},timeout=120.0);print(r.status_code,r.text[:400]);r.raise_for_status()"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: BACKEND_HOST
        fromService:
          type: web
          name: debowoseni-api
          property: host
      - key: AUTOMATION_TOKEN
        fromService:
          type: web
          name: debowoseni-api
          envVarKey: AUTOMATION_TOKEN
